<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Language Transpiler - Web IDE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2d2d30;
            padding: 1rem;
            border-bottom: 1px solid #3e3e42;
        }

        .header h1 {
            color: #569cd6;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #9cdcfe;
            font-size: 0.9rem;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }

        .right-panel {
            border-right: none;
        }

        .panel-header {
            background: #37373d;
            padding: 0.75rem;
            font-weight: bold;
            color: #cccccc;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .run-button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .run-button:hover {
            background: #1177bb;
        }

        .run-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .examples-dropdown {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 0.3rem;
            border-radius: 3px;
            font-family: inherit;
            cursor: pointer;
        }

        .code-input, .output {
            flex: 1;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            border: none;
            resize: none;
            outline: none;
        }

        .code-input {
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .output {
            background: #0c0c0c;
            color: #cccccc;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .status {
            background: #007acc;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-top: 1px solid #3e3e42;
        }

        .status.success { background: #16825d; }
        .status.error { background: #f14c4c; }
        .status.processing { background: #ffcc02; color: #000; }

        .tabs {
            display: flex;
            background: #2d2d30;
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-right: 1px solid #3e3e42;
            transition: background 0.2s;
        }

        .tab:hover {
            background: #3e3e42;
        }

        .tab.active {
            background: #37373d;
            color: #569cd6;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
        }

        .result-item {
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #3e3e42;
        }

        .result-label {
            color: #9cdcfe;
            font-weight: bold;
        }

        .result-value {
            color: #ce9178;
            margin-left: 1rem;
        }

        .error-message {
            color: #f44747;
            background: #3c1e1e;
            padding: 1rem;
            border-left: 4px solid #f44747;
            margin: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔄 Concept Language Transpiler</h1>
        <p>Write Concept 4GL code and see it transpiled to JavaScript in real-time</p>
    </div>

    <div class="container">
        <div class="left-panel">
            <div class="panel-header">
                📝 Concept Code
                <div>
                    <select class="examples-dropdown" id="examplesSelect">
                        <option value="">Load Example...</option>
                        <option value="calculator">Calculator</option>
                        <option value="banking">Banking</option>
                        <option value="payroll">Payroll Demo</option>
                        <option value="if-conditions">If Conditions</option>
                        <option value="loop-processing">Loop Processing</option>

                    </select>
                    <button class="run-button" id="runButton">▶️ Run Code</button>
                </div>
            </div>
            <textarea class="code-input" id="codeInput" placeholder="Enter your Concept code here...

Example:
$constant COMPANY &quot;My Company&quot;

online=&quot;Calculator&quot;

field=&quot;number1&quot; static() storage(i4) initial-value(0)
field=&quot;number2&quot; static() storage(i4) initial-value(0)  
field=&quot;result&quot; static() storage(i4) initial-value(0)

on @START
  assign(&quot;number1&quot; = 10)
  assign(&quot;number2&quot; = 5)
  call('Calculate')
endon

xtra=&quot;Calculate&quot;
on @xtra
  assign(&quot;result&quot; = &quot;number1&quot; + &quot;number2&quot;)
endon"></textarea>
        </div>

        <div class="right-panel">
            <div class="panel-header">
                📊 Results
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="output">Output</div>
                <div class="tab" data-tab="javascript">Generated JS</div>
            </div>
            <div class="tab-content">
                <div id="outputTab" class="output tab-panel active">Click "Run Code" to see results...</div>
                <div id="javascriptTab" class="output tab-panel" style="display: none;">Generated JavaScript will appear here...</div>
            </div>
        </div>
    </div>

    <div class="status" id="status">Ready to transpile Concept code</div>

    <script type="module">
        // Concept Language Transpiler - Browser Version
        
        // Example programs
        const examples = {
            calculator: `$constant PI 3.14159
$constant TAX_RATE 0.15

online="Calculator"

field="number1" static() storage(i4) initial-value(0)
field="number2" static() storage(i4) initial-value(0)
field="result" static() storage(i4) initial-value(0)
field="operation" static() storage(a(10)) initial-value("")

on @START
  assign("number1" = 100)

  assign("operation" = "add")

on @xtra
  assign("result" = "number1" + "number2")

            banking: `$constant BANK_NAME "Visma Bank"
$constant INTEREST_RATE 0.045
$constant MIN_BALANCE 1000

online="BankAccount"

field="accountId" static() storage(i4) initial-value(0)
field="accountHolder" static() storage(a(100)) initial-value("")
field="balance" static() storage(i4) initial-value(0)
field="interestEarned" static() storage(i4) initial-value(0)
field="newBalance" static() storage(i4) initial-value(0)

on @START
  assign("accountId" = 55443322)
  assign("accountHolder" = "Ola Nordmann")
  assign("balance" = 50000)
  call('CalculateInterest')

endon

            payroll: `$constant COMPANY "Visma Enterprise"

online="PayrollSystem"

field="empId" static() storage(i4) initial-value(0)
field="empName" static() storage(a(100)) initial-value("")

on @START
  assign("empId" = 12345)
  assign("empName" = "Alice Johnson")

xtra="CalculateTax"

  assign("taxAmount" = "grossSalary" * 0.25)

            "if-conditions": `$constant DISCOUNT_THRESHOLD 1000

online="OrderValidator"

xtra="ValidateOrder"

  if ("orderTotal" > 0)
    assign("validOrder" = "true")

xtra="CalculateDiscount"
on @xtra
  if ("orderTotal" >= 1000)
    if ("customerType" = "vip")
      assign("discountRate" = 15)
      assign("finalTotal" = "orderTotal" - ("orderTotal" * 0.15))
    endif
  endif
endon`,

            "loop-processing": `$constant MAX_EMPLOYEES 3
$constant BASE_SALARY 50000

online="SalaryCalculator"

field="totalEmployees" static() storage(i4) initial-value(0)
field="currentEmployee" static() storage(i4) initial-value(0)
field="totalSalaryBudget" static() storage(i4) initial-value(0)
field="averageSalary" static() storage(i4) initial-value(0)

on @START
  assign("totalEmployees" = 3)
  call('CalculateBudget')
endon

xtra="CalculateBudget"
on @xtra
  assign("totalSalaryBudget" = 0)
  loop ("currentEmployee" = 1 to "totalEmployees")
    assign("totalSalaryBudget" = "totalSalaryBudget" + 50000)
  endloop
  assign("averageSalary" = "totalSalaryBudget" / "totalEmployees")
endon`,

            "student-grading": `$constant PASSING_GRADE 70

online="GradingSystem"

field="studentId" static() storage(i4) initial-value(0)
field="studentName" static() storage(a(100)) initial-value("")
field="exam1" static() storage(i4) initial-value(0)
field="exam2" static() storage(i4) initial-value(0)
field="totalPoints" static() storage(i4) initial-value(0)
field="averageGrade" static() storage(i4) initial-value(0)
field="passed" static() storage(a(5)) initial-value("false")

on @START
  assign("studentId" = 20241001)
  assign("studentName" = "Maria Olsen")
  assign("exam1" = 85)
  assign("exam2" = 78)
  call('CalculateTotal')
  call('CalculateAverage')
endon

xtra="CalculateTotal"
on @xtra
  assign("totalPoints" = "exam1" + "exam2")

xtra="CalculateAverage"
on @xtra
  assign("averageGrade" = "totalPoints" / 2)
  if ("averageGrade" >= 70)
    assign("passed" = "true")

        };

        // Simple Concept transpiler for browser
        class BrowserConceptTranspiler {
            constructor() {
                this.keywords = new Set([
                    'online', 'xtra', 'field', 'on', 'endon', 'if', 'endif', 'loop', 'endloop', 'to',
                    'assign', 'call', 'static', 'storage', 'initial-value'
                ]);
                
                this.constants = new Map();
                this.fields = new Map();
            }

            transpile(sourceCode) {
                try {
                    const tokens = this.tokenize(sourceCode);
                    const ast = this.parse(tokens);
                    const jsCode = this.generateJS(ast);
                    return { success: true, code: jsCode, ast };
                } catch (error) {
                    return { success: false, error: error.message };
                }
            }

            tokenize(code) {
                const tokens = [];
                const lines = code.split('\n');
                
                for (let lineNum = 0; lineNum < lines.length; lineNum++) {
                    const line = lines[lineNum].trim();
                    if (!line || line.startsWith('*')) continue;

                    // Constants
                    const constMatch = line.match(/^\$constant\s+(\w+)\s+(.*)$/);
                    if (constMatch) {
                        tokens.push({ type: 'CONSTANT', name: constMatch[1], value: constMatch[2], line: lineNum + 1 });
                        continue;
                    }

                    // Online application
                    const onlineMatch = line.match(/^online\s*=\s*"([^"]+)"$/);
                    if (onlineMatch) {
                        tokens.push({ type: 'ONLINE', name: onlineMatch[1], line: lineNum + 1 });
                        continue;
                    }

                    // Field declarations
                    const fieldMatch = line.match(/^field\s*=\s*"([^"]+)"\s+(.*)$/);
                    if (fieldMatch) {
                        tokens.push({ type: 'FIELD', name: fieldMatch[1], props: fieldMatch[2], line: lineNum + 1 });
                        continue;
                    }

                    // Events and keywords
                    if (line.startsWith('on ') || line.startsWith('xtra=') || line === 'endon' || line === 'endif' || line === 'endloop') {
                        tokens.push({ type: 'KEYWORD', value: line, line: lineNum + 1 });
                        continue;
                    }

                    // Statements (assign, call, if, loop)
                    if (line.includes('assign(') || line.includes('call(') || line.startsWith('if (') || line.startsWith('loop (')) {
                        tokens.push({ type: 'STATEMENT', value: line, line: lineNum + 1 });
                    }
                }
                
                return tokens;
            }

            parse(tokens) {
                const ast = { type: 'Program', body: [] };
                let current = null;
                
                for (const token of tokens) {
                    if (token.type === 'CONSTANT') {
                        this.constants.set(token.name, token.value);
                        ast.body.push({ type: 'Constant', name: token.name, value: token.value });
                    }
                    else if (token.type === 'ONLINE') {
                        current = { type: 'OnlineApplication', name: token.name, body: [] };
                        ast.body.push(current);
                    }
                    else if (token.type === 'FIELD') {
                        const initialMatch = token.props.match(/initial-value\(([^)]+)\)/);
                        const storageMatch = token.props.match(/storage\(([^)]+)\)/);
                        this.fields.set(token.name, {
                            name: token.name,
                            initialValue: initialMatch ? initialMatch[1] : '0',
                            storage: storageMatch ? storageMatch[1] : 'i4'
                        });
                        if (current) {
                            current.body.push({ type: 'FieldDeclaration', name: token.name, props: token.props });
                        }
                    }
                    else if (token.type === 'KEYWORD') {
                        if (token.value.startsWith('xtra=')) {
                            const name = token.value.match(/xtra\s*=\s*"([^"]+)"/)[1];
                            current = { type: 'XtraFunction', name, body: [] };
                            ast.body.push(current);
                        }
                        else if (token.value.startsWith('on ')) {
                            const event = token.value.replace('on ', '');
                            current = { type: 'EventHandler', event, body: [] };
                            if (ast.body.length > 0) {
                                ast.body[ast.body.length - 1].body = ast.body[ast.body.length - 1].body || [];
                                ast.body[ast.body.length - 1].body.push(current);
                            }
                        }
                    }
                    else if (token.type === 'STATEMENT' && current) {
                        current.body.push({ type: 'Statement', value: token.value });
                    }
                }
                
                return ast;
            }

            generateJS(ast) {
                let code = `// Generated from Concept code
"use strict";

class ConceptRuntime {
    constructor() {
        this.eventHandlers = new Map();
    }
    
    registerEventHandler(event, handler) {
        if (!this.eventHandlers.has(event)) {
            this.eventHandlers.set(event, []);
        }
        this.eventHandlers.get(event).push(handler);
    }
    
    async triggerEvent(event, data = {}) {
        const handlers = this.eventHandlers.get(event);
        if (handlers) {
            for (const handler of handlers) {
                await handler(data);
            }
        }
    }
    
    async call(functionName, ...args) {
        if (this.currentApplication && typeof this.currentApplication[functionName] === 'function') {
            return await this.currentApplication[functionName](...args);
        }
    }
    
    setApplication(app) {
        this.currentApplication = app;
    }
}

class ConceptApplication {
    constructor() {
        this.runtime = new ConceptRuntime();
        this.runtime.setApplication(this);
        this.fields = {};
        this.constants = {};
        
`;

                // Add constants
                for (const [name, value] of this.constants) {
                    const jsValue = value.startsWith('"') ? value : (isNaN(value) ? `"${value}"` : value);
                    code += `        this.constants.${name} = ${jsValue};\n`;
                }

                // Add field initialization
                code += `\n        // Initialize fields\n`;
                for (const [name, field] of this.fields) {
                    let initialValue = field.initialValue;
                    if (initialValue.startsWith('"') && initialValue.endsWith('"')) {
                        initialValue = initialValue;
                    } else if (initialValue === '""') {
                        initialValue = '""';
                    } else if (isNaN(initialValue)) {
                        initialValue = `"${initialValue}"`;
                    }
                    code += `        this.fields["${name}"] = ${initialValue};\n`;
                }

                code += `    }\n\n`;

                // Generate methods
                for (const item of ast.body) {
                    if (item.type === 'OnlineApplication') {
                        for (const subItem of item.body || []) {
                            if (subItem.type === 'EventHandler') {
                                code += this.generateEventHandler(subItem);
                            }
                        }
                    }
                    else if (item.type === 'XtraFunction') {
                        code += this.generateXtraFunction(item);
                    }
                }

                // Add run method
                code += `    async run() {
        // Register event handlers
        this.runtime.registerEventHandler("@START", this.handle_START.bind(this));
`;

                // Register XTRA handlers
                for (const item of ast.body) {
                    if (item.type === 'XtraFunction') {
                        const funcName = item.name.replace(/[^a-zA-Z0-9]/g, '_');
                        for (const subItem of item.body || []) {
                            if (subItem.type === 'EventHandler') {
                                code += `        this.runtime.registerEventHandler("@xtra_${funcName}", this.handle_xtra_${funcName}.bind(this));\n`;
                            }
                        }
                    }
                }

                code += `
        await this.runtime.triggerEvent("@START");
        return this;
    }

    static async create() {
        const app = new ConceptApplication();
        return await app.run();
    }
}

// Export for execution
window.ConceptApplication = ConceptApplication;
`;

                return code;
            }

            generateEventHandler(eventHandler) {
                const eventName = eventHandler.event.replace('@', '_').replace(/[^a-zA-Z0-9]/g, '_');
                let code = `    async handle_${eventName}(event) {\n`;
                
                for (const stmt of eventHandler.body || []) {
                    code += this.generateStatement(stmt);
                }
                
                code += `    }\n\n`;
                return code;
            }

            generateXtraFunction(xtraFunc) {
                const funcName = xtraFunc.name.replace(/[^a-zA-Z0-9]/g, '_');
                let code = `    async ${funcName}(params = {}) {\n`;
                code += `        await this.runtime.triggerEvent("@xtra_${funcName}");\n`;
                code += `    }\n\n`;
                
                // Generate the event handler
                for (const item of xtraFunc.body || []) {
                    if (item.type === 'EventHandler') {
                        code += `    async handle_xtra_${funcName}(event) {\n`;
                        for (const stmt of item.body || []) {
                            code += this.generateStatement(stmt);
                        }
                        code += `    }\n\n`;
                    }
                }
                
                return code;
            }

            generateStatement(stmt) {
                if (stmt.type !== 'Statement') return '';
                
                const value = stmt.value;
                
                // Handle assign statements
                const assignMatch = value.match(/assign\s*\(\s*"([^"]+)"\s*=\s*(.+)\)/);
                if (assignMatch) {
                    const fieldName = assignMatch[1];
                    let expression = assignMatch[2].trim();
                    
                    // Convert field references
                    expression = expression.replace(/"(\w+)"/g, (match, fieldName) => {
                        if (this.fields.has(fieldName)) {
                            return `this.fields["${fieldName}"]`;
                        }
                        return match;
                    });
                    
                    return `        this.fields["${fieldName}"] = ${expression};\n`;
                }
                
                // Handle call statements
                const callMatch = value.match(/call\s*\(\s*'([^']+)'\s*\)/);
                if (callMatch) {
                    const functionName = callMatch[1];
                    return `        await this.runtime.call("${functionName}");\n`;
                }
                
                // Handle if statements
                if (value.startsWith('if (')) {
                    let condition = value.replace('if (', '').replace(')', '');
                    
                    // Convert field references in condition
                    condition = condition.replace(/"(\w+)"/g, (match, fieldName) => {
                        if (this.fields.has(fieldName)) {
                            return `this.fields["${fieldName}"]`;
                        }
                        return match;
                    });
                    
                    // Convert operators
                    condition = condition.replace(' = ', ' === ');
                    condition = condition.replace(' <> ', ' !== ');
                    
                    return `        if (${condition}) {\n`;
                }
                
                // Handle loop statements
                if (value.startsWith('loop (')) {
                    let loopExpr = value.replace('loop (', '').replace(')', '');
                    
                    // For-style loop
                    const forMatch = loopExpr.match(/"(\w+)"\s*=\s*(\d+)\s+to\s+"(\w+)"/);
                    if (forMatch) {
                        const [, loopVar, start, endVar] = forMatch;
                        return `        for (this.fields["${loopVar}"] = ${start}; this.fields["${loopVar}"] <= this.fields["${endVar}"]; this.fields["${loopVar}"]++) {\n`;
                    }
                }
                
                return '';
            }
        }

        // UI Elements
        const codeInput = document.getElementById('codeInput');
        const runButton = document.getElementById('runButton');
        const outputTab = document.getElementById('outputTab');
        const javascriptTab = document.getElementById('javascriptTab');
        const status = document.getElementById('status');
        const examplesSelect = document.getElementById('examplesSelect');

        const transpiler = new BrowserConceptTranspiler();

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                
                // Update tab appearance
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Show/hide content
                outputTab.style.display = tabName === 'output' ? 'block' : 'none';
                javascriptTab.style.display = tabName === 'javascript' ? 'block' : 'none';
            });
        });

        // Example loading
        examplesSelect.addEventListener('change', (e) => {
            const exampleName = e.target.value;
            if (exampleName && examples[exampleName]) {
                codeInput.value = examples[exampleName];
                e.target.value = ''; // Reset dropdown
            }
        });

        // Run button
        runButton.addEventListener('click', async () => {
            const code = codeInput.value.trim();
            if (!code) {
                showStatus('Please enter some Concept code', 'error');
                return;
            }

            showStatus('Transpiling...', 'processing');
            runButton.disabled = true;

            try {
                // Transpile
                const result = transpiler.transpile(code);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                // Show generated JavaScript
                javascriptTab.textContent = result.code;

                // Execute the generated code
                const script = document.createElement('script');
                script.textContent = result.code;
                document.head.appendChild(script);

                // Create and run the application
                const app = await window.ConceptApplication.create();
                
                // Display results
                displayResults(app);
                showStatus('Execution completed successfully!', 'success');
                
                // Clean up
                document.head.removeChild(script);
                
            } catch (error) {
                outputTab.innerHTML = `<div class="error-message">❌ Error: ${error.message}</div>`;
                showStatus('Execution failed', 'error');
            } finally {
                runButton.disabled = false;
            }
        });

        function displayResults(app) {
            let output = '📊 Field Values:\n';
            
            if (app.fields && Object.keys(app.fields).length > 0) {
                for (const [key, value] of Object.entries(app.fields)) {
                    const displayValue = typeof value === 'string' ? `"${value}"` : value;
                    output += `  ${key}: ${displayValue}\n`;
                }
            } else {
                output += '  (no fields)\n';
            }
            
            output += '\n💰 Constants:\n';
            if (app.constants && Object.keys(app.constants).length > 0) {
                for (const [key, value] of Object.entries(app.constants)) {
                    const displayValue = typeof value === 'string' ? `"${value}"` : value;
                    output += `  ${key}: ${displayValue}\n`;
                }
            } else {
                output += '  (no constants)\n';
            }

            outputTab.textContent = output;
        }

        function showStatus(message, type = 'info') {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        // Load default example
        codeInput.value = examples.calculator;
    </script>
</body>
</html>
